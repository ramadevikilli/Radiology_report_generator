<div class="container mt-5">
    <div class="card shadow-lg p-4">
      <h2 class="text-center text-primary">Login</h2>
  
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email Field -->
        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input id="email" type="email" class="form-control" formControlName="email"  required />
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger small">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Invalid email format.</span>
          </div>
          <div *ngIf="emailExists" class="alert alert-danger mt-2 p-1">Email already exists!</div>
        </div>
  
       
  
        <!-- Password Field -->
        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <input id="password" type="password" class="form-control" formControlName="password" required />
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger small">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
          </div>
        </div>
  
        <!-- Submit Button -->
        <button   type="submit" class="btn btn-success w-100" [disabled]="loginForm.invalid || emailExists">
          Login
        </button>
        <div class="text-center mt-3">
            Don't have an account?
            <button class="btn btn-link" data-bs-toggle="modal" data-bs-target="#signupModal">
              Sign Up
            </button>
          </div>
      </form>
  
      <!-- Success/Error Message -->
      <div *ngIf="message" class="alert alert-success mt-3 text-center">{{ message }}</div>
    </div>
  </div>
